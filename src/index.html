<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AgroCrew · Descubre qué cultivos van con tu terreno</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AgroCrew: plataforma web que recomienda cultivos compatibles con tu terreno usando datos oficiales de suelo (MIDAGRI), clima (Open-Meteo) y riesgo hídrico (ANA).">
  <meta name="theme-color" content="#2F5D3A">
  <meta property="og:title" content="AgroCrew">
  <meta property="og:description" content="Descubre qué cultivos son compatibles con tu terreno, con datos oficiales.">
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap">
  <script>
    // Aplica el tema y el idioma guardados antes de dibujar la página (mismas claves que la app web).
    (function () {
      var tema = null, idioma = null;
      try { tema = localStorage.getItem('agrocrew.tema'); idioma = localStorage.getItem('agrocrew.idioma'); } catch (e) {}
      if (tema !== 'claro' && tema !== 'oscuro') {
        tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      }
      document.documentElement.setAttribute('data-theme', tema === 'oscuro' ? 'dark' : 'light');
      if (idioma === 'en') { document.documentElement.lang = 'en'; }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
